<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Rail on/off control: DIS_x forces the TPS2121 OV pins high">
<title>Rail on/off control: DIS_x forces the TPS2121 OV pins high</title>
<rect width="820" height="300" fill="#ffffff"/>
<rect x="20" y="30" width="130" height="45" rx="6" fill="#fdf1d6" stroke="#3c4043" stroke-width="1.3"/>
<text x="85.0" y="48.5" text-anchor="middle" font-size="13" font-weight="bold">+3V3_AUX</text>
<text x="85.0" y="64.5" text-anchor="middle" font-size="13">always on</text>
<rect x="300" y="30" width="130" height="45" rx="6" fill="#f3e8fd" stroke="#3c4043" stroke-width="1.3"/>
<text x="365.0" y="48.5" text-anchor="middle" font-size="13" font-weight="bold">DIS_x</text>
<text x="365.0" y="64.5" text-anchor="middle" font-size="13">high = rail OFF</text>
<rect x="600" y="30" width="190" height="45" rx="6" fill="#e8f0fe" stroke="#3c4043" stroke-width="1.3"/>
<text x="695.0" y="48.5" text-anchor="middle" font-size="13" font-weight="bold">OV1 / OV2 of the mux</text>
<text x="695.0" y="64.5" text-anchor="middle" font-size="13">above VREF = OFF</text>
<rect x="20" y="140" width="130" height="45" rx="6" fill="#e8f0fe" stroke="#3c4043" stroke-width="1.3"/>
<text x="85.0" y="158.5" text-anchor="middle" font-size="13" font-weight="bold">Pico EN_x</text>
<text x="85.0" y="174.5" text-anchor="middle" font-size="13">high = rail ON</text>
<rect x="300" y="140" width="130" height="55" rx="6" fill="#f1f3f4" stroke="#3c4043" stroke-width="1.3"/>
<text x="365.0" y="155.5" text-anchor="middle" font-size="13" font-weight="bold">2N7002</text>
<text x="365.0" y="171.5" text-anchor="middle" font-size="13">gate: 100k to GND</text>
<text x="365.0" y="187.5" text-anchor="middle" font-size="13">drain on DIS_x</text>
<rect x="20" y="235" width="130" height="45" rx="6" fill="#e6f4ea" stroke="#3c4043" stroke-width="1.3"/>
<text x="85.0" y="253.5" text-anchor="middle" font-size="13" font-weight="bold">DIP switch SW1</text>
<text x="85.0" y="269.5" text-anchor="middle" font-size="13">position n</text>
<path d="M150,52.5 L300,52.5" fill="none" stroke="#3c4043" stroke-width="1.4"/>
<polygon points="300.0,52.5 291.8,48.8 291.8,56.2" fill="#3c4043"/>
<path d="M430,52.5 L600,52.5" fill="none" stroke="#3c4043" stroke-width="1.4"/>
<polygon points="600.0,52.5 591.8,48.8 591.8,56.2" fill="#3c4043"/>
<path d="M150,162.5 L300,167.5" fill="none" stroke="#3c4043" stroke-width="1.4"/>
<polygon points="300.0,167.5 291.9,163.6 291.7,170.9" fill="#3c4043"/>
<path d="M400,140 L400,77" fill="none" stroke="#3c4043" stroke-width="1.4"/>
<polygon points="400.0,77.0 396.3,85.2 403.7,85.2" fill="#3c4043"/>
<path d="M150,257 L330,257 L330,77" fill="none" stroke="#3c4043" stroke-width="1.4"/>
<polygon points="330.0,77.0 326.3,85.2 333.7,85.2" fill="#3c4043"/>
<rect x="185.4" y="36.5" width="79.2" height="14" fill="#ffffff"/><text x="225.0" y="47.5" text-anchor="middle" font-size="11" fill="#1a73e8">4.7k pull-up</text>
<rect x="493.7" y="36.5" width="42.6" height="14" fill="#ffffff"/><text x="515.0" y="47.5" text-anchor="middle" font-size="11" fill="#1a73e8">BAT54A</text>
<rect x="209.8" y="149.0" width="30.4" height="14" fill="#ffffff"/><text x="225.0" y="160.0" text-anchor="middle" font-size="11" fill="#1a73e8">100R</text>
<rect x="405.0" y="101" width="115.8" height="14" fill="#ffffff"/><text x="408" y="112" text-anchor="start" font-size="11" fill="#1a73e8">pulls DIS_x to GND</text>
<rect x="142.4" y="240" width="195.1" height="14" fill="#ffffff"/><text x="240" y="251" text-anchor="middle" font-size="11" fill="#1a73e8">shorts DIS_x to GND (manual ON)</text>
</svg>